<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>broad selectors</title>
<script src="/recorder.js"></script>
</head>
<body>
<!-- Every ineligible element comes BEFORE the eligible fields, so a throw on any of them
     would leave the eligible fields unfilled. -->
<form id="f" action="/submitted" method="post">
  <div id="d1">div text</div><span id="sp">span text</span>
  <button id="b1" type="button" value="bv">B1</button>
  <button id="b2" type="submit" value="sv">B2</button>
  <input id="hid" type="hidden" value="h0">
  <input id="cb" type="checkbox">
  <input id="rd" type="radio" value="r0">
  <input id="file" type="file">
  <input id="sub" type="submit" value="Go">
  <input id="rst" type="reset" value="Reset">
  <input id="img" type="image" alt="img">
  <input id="ibtn" type="button" value="ib">
  <select id="sel"><option id="o1" value="o1">O1</option><option id="o2" value="o2">O2</option></select>
  <output id="out">o</output>
  <progress id="prog" value="0.5"></progress>
  <meter id="met" value="0.5"></meter>
  <data id="dat" value="dv">d</data>
  <ul><li id="li" value="3">li</li></ul>
  <input id="num" type="number">
  <input id="t1">
  <textarea id="t2"></textarea>
  <input id="t3" type="search">
  <input id="t4" type="tel">
  <input id="t5" type="url">
</form>
</body>
</html>
